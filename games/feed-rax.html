<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Feed Rax</title><link rel="stylesheet" href="style.css">
<style>#btns{display:flex;gap:10px;justify-content:center;padding:12px 10px calc(env(safe-area-inset-bottom,0px) + 12px)}#btns button{flex:1;max-width:130px;font:900 1rem ui-monospace,monospace;text-transform:uppercase;padding:.85rem 0;border:4px solid #000;box-shadow:4px 4px 0 #f3f6ff;cursor:pointer}#btns button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #f3f6ff}</style></head>
<body><a class="back" href="index.html">← games</a><canvas id="c"></canvas>
<div id="btns"><button id="feed" style="background:#39ff14">feed</button><button id="play" style="background:#ffe600">play</button><button id="sleep" style="background:#00e5ff">sleep</button></div>
<script src="common.js"></script>
<script>
const KEY = 'raxgames:pet', W = 360, H = 520, c = document.getElementById('c'), ctx = G.setup(c, W, H, 84), bgi = G.img('assets/bg/feed-rax.png'), cl = G.cl;
let p = { h: 80, f: 80, e: 80, sleep: false, t: Date.now() };
try { p = Object.assign(p, JSON.parse(localStorage.getItem(KEY))); } catch (e) {}
const away = Math.min(1440, (Date.now() - p.t) / 60000); p.h = cl(p.h - .2 * away, 0, 100); p.f = cl(p.f - .15 * away, 0, 100); p.e = cl(p.sleep ? p.e + .5 * away : p.e - .1 * away, 0, 100);
const save = () => { p.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} };
let eat = 0, jump = 0, poke = 0, blink = 0, nextBlink = 2, t = 0, last = performance.now(), saveT = 0;
document.getElementById('feed').onclick = () => { p.sleep = false; p.h = cl(p.h + 25, 0, 100); eat = 1.4; save(); };
document.getElementById('play').onclick = () => { p.sleep = false; p.f = cl(p.f + 18, 0, 100); p.e = cl(p.e - 6, 0, 100); p.h = cl(p.h - 3, 0, 100); jump = 1.2; save(); };
document.getElementById('sleep').onclick = () => { p.sleep = !p.sleep; save(); };
c.addEventListener('pointerdown', () => { if (p.sleep) p.sleep = false; p.f = cl(p.f + 1.5, 0, 100); poke = .5; });
function bar(label, v, y, col) { ctx.fillStyle = '#000'; ctx.fillRect(70, y, 250, 16); ctx.fillStyle = v < 25 ? '#ff4d6d' : col; ctx.fillRect(70, y, 250 * v / 100, 16); ctx.strokeStyle = '#f3f6ff'; ctx.lineWidth = 2; ctx.strokeRect(70, y, 250, 16); G.text(ctx, label, 16, y + 13, 12, '#fff', 'left'); }
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; t += dt; requestAnimationFrame(frame); eat -= dt; jump -= dt; poke -= dt; nextBlink -= dt; blink -= dt; saveT += dt;
  if (nextBlink <= 0) { blink = .12; nextBlink = G.rnd(2, 6); }
  if (p.sleep) { p.e = cl(p.e + 1.2 * dt, 0, 100); if (p.e >= 100) p.sleep = false; } else p.e = cl(p.e - .1 / 60 * dt * 60 / 60, 0, 100);
  p.h = cl(p.h - .2 / 60 * dt, 0, 100); p.f = cl(p.f - .15 / 60 * dt, 0, 100); if (saveT > 5) { saveT = 0; save(); }
  const low = Math.min(p.h, p.f) < 20, tired = p.e < 25, happy = Math.min(p.h, p.f, p.e) > 60; let o = { eye: 1, smile: .35, open: 0 };
  if (p.sleep) o = { eye: .05, smile: .2, open: 0 }; else if (eat > 0) o = { eye: 1, smile: .8, open: .5 + .4 * Math.abs(Math.sin(t * 12)) }; else if (jump > 0) o = { eye: 1.2, smile: 1, open: 0 }; else if (poke > 0) o = { eye: 1.3, smile: .3, open: .35 }; else if (low) o = { eye: .7, smile: -.7, open: 0 }; else if (tired) o = { eye: .35, smile: 0, open: 0 }; else if (happy) o = { eye: 1, smile: 1, open: 0 };
  if (blink > 0 && !p.sleep) o.eye = .05; const by = -(jump > 0 ? Math.abs(Math.sin(jump * 7)) * 40 : 0) - (poke > 0 ? poke * 30 : 0) + Math.sin(t * 1.6) * 5;
  G.bg(ctx, bgi, W, H, '#0a1633', '#150a2e'); G.shadow(ctx, W / 2, 430, 60 - by * .3, .3); G.rax(ctx, W / 2, 270 + by, 62, o); bar('FOOD', p.h, 18, '#39ff14'); bar('FUN', p.f, 42, '#ffe600'); bar('REST', p.e, 66, '#00e5ff');
  if (p.sleep) { ctx.fillStyle = 'rgba(0,0,10,.55)'; ctx.fillRect(0, 0, W, H); G.text(ctx, 'z z z', W / 2 + 70, 150 + Math.sin(t * 2) * 6, 26, '#6FE3FF'); G.rax(ctx, W / 2, 270 + by, 62, o); }
  const say = p.sleep ? 'sleeping...' : low ? 'rax needs you' : tired ? 'rax is sleepy' : happy ? 'rax is happy' : 'rax is fine'; G.text(ctx, say, W / 2, 490, 16, '#ffe600');
}
document.addEventListener('visibilitychange', save); addEventListener('pagehide', save); requestAnimationFrame(frame);
</script></body></html>
